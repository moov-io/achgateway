name: Create Release

on:
  push:
    tags: [ "v*.*.*" ]

jobs:
  testing:
    name: Testing
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest] # macos-latest, windows-latest
    steps:
    - name: Set up Go 1.x
      uses: actions/setup-go@v7
      with:
        go-version: 'stable'
      id: go

    - name: Check out code into the Go module directory
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install
      run: make install

    - name: Setup
      run: make setup

    - name: Check
      run: make check

  create_release:
    name: Create Release
    needs: [testing]
    runs-on: ubuntu-latest
    steps:
    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        prerelease: true

    - name: Output Release URL File
      run: echo "${{ steps.create_release.outputs.upload_url }}" > release_url.txt

    - name: Save Release URL File for publish
      uses: actions/upload-artifact@v7
      with:
        name: release_url
        path: release_url.txt
        retention-days: 1

  publish:
    name: Publish
    needs: [testing, create_release]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
            asset: achgateway-linux-amd64
          - os: ubuntu-latest
            arch: arm64
            asset: achgateway-linux-arm64
          - os: macos-latest
            arch: arm64
            asset: achgateway-darwin-arm64
          - os: macos-latest
            arch: amd64
            asset: achgateway-darwin-amd64
          - os: windows-latest
            arch: amd64
            asset: achgateway.exe
    steps:
    - name: Set up Go 1.x
      uses: actions/setup-go@v7
      with:
        go-version: 'stable'
      id: go

    - name: Check out code into the Go module directory
      uses: actions/checkout@v7

    - name: Load Release URL File from release job
      uses: actions/download-artifact@v8
      with:
        name: release_url
        path: release_url
        retention-days: 1

    - name: Install
      run: make install

    - name: Distribute
      run: make dist ARCH=${{ matrix.arch }}

    - name: Get Release File Name & Upload URL
      id: get_release_info
      shell: bash
      run: |
        value=`cat release_url/release_url.txt`
        echo ::set-output name=upload_url::$value
      env:
        TAG_REF_NAME: ${{ github.ref }}
        REPOSITORY_NAME: ${{ github.repository }}

    - name: Upload Binary
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.get_release_info.outputs.upload_url }}
        asset_path: ./bin/${{ matrix.asset }}
        asset_name: ${{ matrix.asset }}
        asset_content_type: application/octet-stream

  docker:
    name: Docker ${{ matrix.arch }}
    needs: [testing, create_release]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
    - name: Set up Go 1.x
      uses: actions/setup-go@v7
      with:
        go-version: 'stable'
      id: go

    - name: Check out code into the Go module directory
      uses: actions/checkout@v7

    - name: Install
      run: make install

    - name: Login to Docker Hub
      run: echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
      env:
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push image
      run: |
        make docker-build-arch ARCH=${{ matrix.arch }}
        make docker-push-arch ARCH=${{ matrix.arch }}

  docker-manifest:
    name: Docker Manifest
    needs: [docker]
    runs-on: ubuntu-latest
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@v7

    - name: Login to Docker Hub
      run: echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
      env:
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

    - name: Create and push manifests
      run: make docker-manifest
