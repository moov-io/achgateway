name: Create Release

on:
  push:
    tags: [ "v*.*.*" ]

permissions:
  contents: read

jobs:
  testing:
    name: Testing
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest] # macos-latest, windows-latest
    steps:
    - name: Set up Go 1.x
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: stable
        cache: false
      id: go

    - name: Check out code into the Go module directory
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Install
      run: make install

    - name: Setup
      run: make setup

    - name: Check
      run: make check

  create_release:
    permissions:
      contents: write
    name: Create Release
    needs: [testing]
    runs-on: ubuntu-latest
    steps:
    - name: Ensure GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ github.ref_name }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
          echo "Release $TAG already exists — reusing"
        else
          gh release create "$TAG" \
            --repo "$REPO" \
            --title "Release $TAG" \
            --prerelease
        fi

  publish:
    permissions:
      contents: write
    name: Publish
    needs: [testing, create_release]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
            asset: achgateway-linux-amd64
          - os: ubuntu-latest
            arch: arm64
            asset: achgateway-linux-arm64
          - os: macos-latest
            arch: arm64
            asset: achgateway-darwin-arm64
          - os: macos-latest
            arch: amd64
            asset: achgateway-darwin-amd64
          - os: windows-latest
            arch: amd64
            asset: achgateway.exe
    steps:
    - name: Set up Go 1.x
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: stable
        cache: false
      id: go

    - name: Check out code into the Go module directory
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install
      run: make install

    - name: Distribute
      run: make dist ARCH=${{ matrix.arch }}

    - name: Upload release asset
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ github.ref_name }}
        REPO: ${{ github.repository }}
        ASSET: ${{ matrix.asset }}
      shell: bash
      run: |
        set -euo pipefail
        gh release upload "$TAG" "./bin/${ASSET}" --repo "$REPO" --clobber

  docker:
    name: Docker ${{ matrix.arch }}
    needs: [testing, create_release]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
